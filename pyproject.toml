[tool.ruff]
line-length = 110
target-version = "py312"
[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
# usv_class.py and usv_library.py contain a few methods the original
# author left explicitly marked as in-progress / not-yet-used research
# scaffolding (see "IN PROGRESS" / "NOT NEEDED FOR NOW" comments in
# usv_class.py). These are kept for transparency rather than deleted,
# so we don't lint-fail on their unfinished internals.
"usv_pipeline/usv_class.py" = ["F821", "F841", "E711"]
"usv_pipeline/usv_library.py" = ["F841", "E722", "E741"]
